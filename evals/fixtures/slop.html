<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    body { font-family: 'Inter', sans-serif; color: #000; }
    .hero { min-height: 100vh; background: linear-gradient(135deg, #7c3aed, #3b82f6); }
    .card { transition: all 300ms ease; }
    .card:hover { transform: scale(1.05); }
    button:focus { outline: none; }
    h1 { background-clip: text; }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Elevate your workflow with seamless AI</h1>
    <p>Lorem ipsum dolor sit amet. Unlock your potential — today.</p>
  </section>
</body>
</html>
